<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Original vector illustration of replacement car parts on a workbench</title>
  <desc id="desc">A code-authored illustration showing an alternator, starter motor, brake pads, an air filter, a sensor, and spark plugs. It contains no customer vehicle details.</desc>
  <defs>
    <linearGradient id="bench" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13243a" />
      <stop offset="1" stop-color="#243b57" />
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#dbe8f4" />
      <stop offset="0.52" stop-color="#91a9bc" />
      <stop offset="1" stop-color="#4d6579" />
    </linearGradient>
    <linearGradient id="rubber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#27394a" />
      <stop offset="1" stop-color="#0d1825" />
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#07111f" flood-opacity="0.38" />
    </filter>
  </defs>

  <rect width="960" height="640" rx="36" fill="url(#bench)" />
  <g opacity="0.14" stroke="#b7d8ef" stroke-width="2">
    <path d="M0 112h960M0 224h960M0 336h960M0 448h960M0 560h960" />
    <path d="M112 0v640M224 0v640M336 0v640M448 0v640M560 0v640M672 0v640M784 0v640M896 0v640" />
  </g>
  <path d="M44 526c164-56 270-36 418-10 170 30 282 12 454-52v132H44Z" fill="#0a1726" opacity="0.55" />

  <!-- Unbranded alternator illustration -->
  <g filter="url(#shadow)" transform="translate(102 88)">
    <path d="M42 128 74 53h148l41 75-26 91H70Z" fill="url(#metal)" stroke="#d7e7f3" stroke-width="5" />
    <circle cx="148" cy="126" r="69" fill="#607b8e" stroke="#e4f1fa" stroke-width="7" />
    <circle cx="148" cy="126" r="47" fill="#273b4e" stroke="#9cb8c9" stroke-width="7" />
    <circle cx="148" cy="126" r="15" fill="#cfdfeb" />
    <g stroke="#b5cfde" stroke-width="8" stroke-linecap="round">
      <path d="m148 79 0 22M181 91l-15 17M194 126h-22M181 161l-15-17M148 173v-22M115 161l15-17M102 126h22M115 91l15 17" />
    </g>
    <circle cx="74" cy="64" r="8" fill="#f3b84b" /><circle cx="232" cy="67" r="8" fill="#f3b84b" />
    <path d="M72 222h154" stroke="#132b3e" stroke-width="12" stroke-linecap="round" />
  </g>

  <!-- Unbranded starter motor illustration -->
  <g filter="url(#shadow)" transform="translate(530 70) rotate(-8 145 120)">
    <path d="M42 74h188c28 0 49 22 49 50v62c0 28-21 50-49 50H42c-23 0-42-19-42-42v-78c0-23 19-42 42-42Z" fill="url(#metal)" stroke="#e3f0f8" stroke-width="5" />
    <path d="M230 82h64v146h-64Z" fill="#4d677b" stroke="#dcebf4" stroke-width="5" />
    <circle cx="42" cy="113" r="39" fill="#20394f" stroke="#a9c2d2" stroke-width="6" />
    <circle cx="42" cy="113" r="16" fill="#dcebf3" />
    <path d="M84 85v142M111 85v142M138 85v142M165 85v142M192 85v142" stroke="#7891a3" stroke-width="8" opacity="0.7" />
    <path d="M294 111h34v28h-34M294 171h34v28h-34" fill="#f3b84b" />
  </g>

  <!-- Brake pads and filter -->
  <g filter="url(#shadow)" transform="translate(84 384)">
    <path d="M0 38 30 0h88l30 38v126H0Z" fill="#dbe8f0" stroke="#f7fbff" stroke-width="5" />
    <path d="M34 18h80v118H34Z" fill="#7b93a4" />
    <path d="M46 30h56M46 53h56M46 76h56M46 99h56M46 122h56" stroke="#d8e6ef" stroke-width="8" />
    <path d="M176 38 206 0h88l30 38v126H176Z" fill="#c6d7e1" stroke="#f7fbff" stroke-width="5" />
    <path d="M210 18h80v118h-80Z" fill="#667f93" />
    <path d="M222 30h56M222 53h56M222 76h56M222 99h56M222 122h56" stroke="#c6dbe7" stroke-width="8" />
  </g>

  <g filter="url(#shadow)" transform="translate(454 378)">
    <rect x="0" y="24" width="194" height="132" rx="20" fill="#c7d8e2" stroke="#f1f8fc" stroke-width="5" />
    <rect x="21" y="47" width="152" height="88" rx="12" fill="#38526a" />
    <path d="M37 61h120M37 77h120M37 93h120M37 109h120M37 125h120" stroke="#9bb7c7" stroke-width="7" />
    <path d="M28 8h138l-14 24H42Z" fill="#91aabd" stroke="#f1f8fc" stroke-width="5" />
  </g>

  <!-- Sensor and spark plugs -->
  <g filter="url(#shadow)" transform="translate(728 344)">
    <path d="M32 28h55v80H32Z" fill="#dfebf2" stroke="#f8fcff" stroke-width="5" />
    <path d="M8 0h103v31H8Z" fill="#f3b84b" stroke="#fff1c7" stroke-width="5" />
    <path d="M49 108h21v64H49Z" fill="#91a9b9" />
    <path d="M43 172h33l-6 29H49Z" fill="#dbe9f0" />
    <path d="M110 17c38 5 59 23 64 55" fill="none" stroke="#f3b84b" stroke-width="12" stroke-linecap="round" />
  </g>
  <g filter="url(#shadow)" transform="translate(744 492) rotate(8)">
    <g transform="translate(0 0)"><path d="M0 0h22v76H0Z" fill="#e5eff4" /><path d="M-7 76h36l-8 17H1Z" fill="#f3b84b" /><path d="M-2 93h26" stroke="#a6bfce" stroke-width="7" /></g>
    <g transform="translate(42 6)"><path d="M0 0h22v76H0Z" fill="#e5eff4" /><path d="M-7 76h36l-8 17H1Z" fill="#f3b84b" /><path d="M-2 93h26" stroke="#a6bfce" stroke-width="7" /></g>
    <g transform="translate(84 12)"><path d="M0 0h22v76H0Z" fill="#e5eff4" /><path d="M-7 76h36l-8 17H1Z" fill="#f3b84b" /><path d="M-2 93h26" stroke="#a6bfce" stroke-width="7" /></g>
  </g>

  <circle cx="82" cy="83" r="10" fill="#f3b84b" />
  <circle cx="884" cy="92" r="7" fill="#6ed0c1" />
</svg>
